<!DOCTYPE html>
<html>

<head>

    <title>Buddy - Search Order</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <nav class="navbar">

        <a class="brand" href="/">BUDDY</a>

        <div class="nav-links">

            <a href="/">Home</a>
            <a href="/menu">Menu</a>
            <a href="/cart">Cart</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/orders">Orders</a>
            <a href="/current-orders">Current Orders</a>

        </div>

    </nav>

    <h1>Buddy</h1>

    <h2>Search Orders</h2>

    <hr>

    <h3>Search by Order ID</h3>

    <form method="POST" action="/search-order">

        <label>Order ID:</label>

        <input
            type="number"
            name="order_id"
            min="1"
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

    <hr>

    <h3>Search by Customer Name</h3>

    <form method="POST" action="/search-customer">

        <label>Customer Name:</label>

        <input
            type="text"
            name="name"
            required
        >

        <button type="submit">
            Search
        </button>

    </form>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</body>

</html>
